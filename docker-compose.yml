x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile

  image: realtime-fraud-airflow:2.9.2

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ""

    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}"

  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    # SECURITY NOTE: Docker socket is mounted to allow Airflow to trigger Spark jobs via Docker.
    # This setup is strictly for LOCAL DEVELOPMENT AND PORTFOLIO DEMO PURPOSES.
    # Do not deploy this configuration to a shared or production network.
    - /var/run/docker.sock:/var/run/docker.sock

  user: "0:0"

  mem_limit: 512m

  restart: "no"

  profiles:
    - airflow

  networks:
    - lakehouse-net
services:

  # PROFILE: ingest

  # 1. SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    mem_limit: 2g

    ports:
      - "127.0.0.1:1433:1433"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?}
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_MEMORY_LIMIT_MB: "1536"

    volumes:
      - mssql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    profiles:
      - ingest

    networks:
      - lakehouse-net


  # 1.1 SQL Server Initialization
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-init
    mem_limit: 256m

    depends_on:
      sqlserver:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |-
        for attempt in {1..60}; do
          if /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$MSSQL_SA_PASSWORD" \
            -C \
            -l 5 \
            -b \
            -Q "SELECT 1" >/dev/null 2>&1; then

            echo "SQL Server accepts network connections."
            break
          fi

          if [ "$$attempt" -eq 60 ]; then
            echo "SQL Server did not accept connections." >&2
            exit 1
          fi

          echo "Waiting for SQL Server network listener ($$attempt/60)..."
          sleep 5
        done

        exec /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -b \
          -i /init/init.sql

    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?}

    volumes:
      - ./sql:/init:ro

    restart: "no"

    profiles:
      - ingest

    networks:
      - lakehouse-net


  # 2. Apache Kafka - KRaft
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    mem_limit: 768m

    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,
        PLAINTEXT_EXTERNAL://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:9092,
        PLAINTEXT_EXTERNAL://localhost:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_HEAP_OPTS: "-Xms384m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

    networks:
      - lakehouse-net


  # 3. Debezium Kafka Connect
  debezium:
    image: quay.io/debezium/connect:2.4
    container_name: debezium
    mem_limit: 1g

    depends_on:
      kafka:
        condition: service_healthy

      sqlserver:
        condition: service_healthy

      sql-init:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 2

      CONFIG_STORAGE_TOPIC: fraud_connect_configs
      OFFSET_STORAGE_TOPIC: fraud_connect_offset
      STATUS_STORAGE_TOPIC: fraud_connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      HEAP_OPTS: "-Xms256m -Xmx640m"

    profiles:
      - ingest

    networks:
      - lakehouse-net


  # PROFILE: ui

  # 4. Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    mem_limit: 512m

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "127.0.0.1:8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    profiles:
      - ui

    networks:
      - lakehouse-net


  # PROFILE: process

  # 5. HDFS NameNode
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    user: root
    mem_limit: 768m

    command:
      - hdfs
      - namenode
  
    ports:
      - "127.0.0.1:9870:9870"

    environment:
      HDFS_NAMENODE_USER: root
      ENSURE_NAMENODE_DIR: /hadoop-data/name

      HADOOP_HEAPSIZE_MAX: 512m

      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020

      HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020

      HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop-data/name

      HDFS-SITE.XML_dfs.replication: "1"

      HDFS-SITE.XML_dfs.permissions.enabled: "false"

      HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"

    volumes:
      - namenode_data:/hadoop-data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/9870' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

    profiles:
      - process

    networks:
      - lakehouse-net


  # 6. HDFS DataNode
  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    user: root
    mem_limit: 512m

    command:
      - hdfs
      - datanode

    depends_on:
      namenode:
        condition: service_healthy

    environment:
      HDFS_DATANODE_USER: root

      HADOOP_HEAPSIZE_MAX: 384m

      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020

      HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020

      HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop-data/data

      HDFS-SITE.XML_dfs.replication: "1"

    volumes:
      - datanode_data:/hadoop-data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/9864' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    profiles:
      - process

    networks:
      - lakehouse-net


  # 7. Spark Processing Container
  spark-silver:
    image: apache/spark:3.5.6-python3
    container_name: spark-silver
    user: root
    mem_limit: 1536m

    depends_on:
      kafka:
        condition: service_healthy

      namenode:
        condition: service_healthy

      datanode:
        condition: service_healthy

    environment:
      AVAILABLE_NOW: ${AVAILABLE_NOW:-false}

    command: ["/opt/spark/bin/spark-submit", "/opt/jobs/silver_stream.py"]

    ports:
      - "127.0.0.1:4040:4040"

    volumes:
      - ./spark/jobs:/opt/jobs:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_ivy:/ivy

    restart: "no"

    profiles:
      - process

    networks:
      - lakehouse-net

  # 8. PostgreSQL database for Hive Metastore metadata
  hive-metastore-db:
    image: postgres:16
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    mem_limit: 256m

    environment:
      POSTGRES_DB: ${HIVE_METASTORE_DB}
      POSTGRES_USER: ${HIVE_METASTORE_USER}
      POSTGRES_PASSWORD: ${HIVE_METASTORE_PASSWORD}

    volumes:
      - hive_metastore_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 15

    restart: "no"

    profiles:
      - process

    networks:
      - lakehouse-net


  # 9. Initialize Hive schema only when the database is empty
  hive-metastore-init:
    image: realtime-fraud-hive-metastore:3.1.3
    container_name: hive-metastore-init
    mem_limit: 512m

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for attempt in {1..30}; do
          if /opt/hive/bin/schematool -dbType postgres -info >/tmp/schema-info.log 2>&1; then
            cat /tmp/schema-info.log
            echo "Hive Metastore schema is already initialized."
            exit 0
          fi

          if (echo > /dev/tcp/hive-metastore-db/5432) 2>/dev/null; then
            cat /tmp/schema-info.log
            exec /opt/hive/bin/schematool -dbType postgres -initSchema
          fi

          echo "Waiting for Hive metadata database ($$attempt/30)..."
          sleep 2
        done

        cat /tmp/schema-info.log
        exit 1

    environment:
      HADOOP_CLIENT_OPTS: >-
        -Xmx384m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/${HIVE_METASTORE_DB}
        -Djavax.jdo.option.ConnectionUserName=${HIVE_METASTORE_USER}
        -Djavax.jdo.option.ConnectionPassword=${HIVE_METASTORE_PASSWORD}

    depends_on:
      hive-metastore-db:
        condition: service_healthy

    restart: "no"

    profiles:
      - process

    networks:
      - lakehouse-net

  # 10. Apache Hive Metastore
  hive-metastore:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile

    image: realtime-fraud-hive-metastore:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    mem_limit: 768m

    profiles:
      - process

    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"
      DEFAULT_FS: hdfs://namenode:8020
      HIVE_WAREHOUSE_PATH: /lakehouse/warehouse
      SERVICE_OPTS: >-
        -Xmx512m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/${HIVE_METASTORE_DB}
        -Djavax.jdo.option.ConnectionUserName=${HIVE_METASTORE_USER}
        -Djavax.jdo.option.ConnectionPassword=${HIVE_METASTORE_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    ports:
      - "127.0.0.1:9083:9083"

    restart: "no"

    networks:
      - lakehouse-net

  # Airflow metadata database
  airflow-postgres:
    image: postgres:16

    container_name: airflow-postgres

    mem_limit: 256m

    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: "no"

    profiles:
      - airflow

    networks:
      - lakehouse-net

  airflow-init:
    <<: *airflow-common

    container_name: airflow_init

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username admin \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Assem \
          --lastname Admin \
          --role Admin \
          --email admin@example.com \
          || echo "Admin user already exists."

    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
      AIRFLOW_SECRET_KEY: "${AIRFLOW_SECRET_KEY}"

    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow_webserver

    command: webserver

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow_scheduler

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 10. Spark Thrift Server - SQL Analytics
  spark-thrift:
    image: apache/spark:3.5.6-python3

    container_name: spark-thrift

    hostname: spark-thrift

    user: root

    mem_limit: 1g

    depends_on:
      namenode:
        condition: service_healthy

      datanode:
        condition: service_healthy

      hive-metastore:
        condition: service_healthy

    command:
      - /opt/spark/bin/spark-submit
      - --class
      - org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      - --master
      - local[1]
      - --driver-memory
      - 512m
      - --packages
      - io.delta:delta-spark_2.12:3.3.0
      - --conf
      - spark.sql.warehouse.dir=hdfs://namenode:8020/lakehouse/warehouse
      - --conf
      - spark.hadoop.fs.defaultFS=hdfs://namenode:8020
      - --conf
      - spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
      - spark-internal
      - --hiveconf
      - hive.server2.thrift.port=10000
      - --hiveconf
      - hive.server2.thrift.bind.host=0.0.0.0

    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:4041:4040"

    volumes:
      - ./spark/conf/spark-thrift-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_ivy:/ivy
      - spark_ivy:/root/.ivy2

    # A running Spark process is not ready for JDBC until HiveServer2 binds 10000.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/10000' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 3m

    restart: "no"

    profiles:
      - process

    networks:
      - lakehouse-net


networks:
  lakehouse-net:
    driver: bridge
    name: lakehouse-net

volumes:
  mssql_data:
  kafka_data:
  namenode_data:
  datanode_data:
  spark_ivy:
  hive_metastore_db_data:
  airflow_postgres_data:
