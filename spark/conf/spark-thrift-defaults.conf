# Spark Thrift Server configuration (Spark 3.5.6 / Scala 2.12)
spark.master                       local[1]
spark.driver.memory                512m
spark.jars.ivy                    /ivy
spark.driver.extraClassPath        /ivy/jars/io.delta_delta-spark_2.12-3.3.0.jar:/ivy/jars/io.delta_delta-storage-3.3.0.jar

spark.sql.extensions               io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog    org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.shuffle.partitions       2
spark.sql.session.timeZone         UTC

spark.hadoop.fs.defaultFS          hdfs://namenode:8020
spark.sql.catalogImplementation    hive
spark.sql.hive.metastore.uris      thrift://hive-metastore:9083
spark.sql.hive.metastore.version   3.1.3
spark.sql.hive.metastore.jars      maven
spark.sql.warehouse.dir            hdfs://namenode:8020/lakehouse/warehouse
