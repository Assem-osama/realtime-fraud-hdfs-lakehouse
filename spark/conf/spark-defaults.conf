# Spark Runtime

spark.master                       local[2]
spark.driver.memory                1g
spark.ui.enabled                   true
spark.ui.port                      4040


# Kafka + Delta Lake
# Spark 3.5.6 / Scala 2.12

spark.jars.packages                org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,io.delta:delta-spark_2.12:3.3.0
spark.jars.ivy                     /ivy

# Delta Lake & HDFS Config

spark.sql.extensions               io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog    org.apache.spark.sql.delta.catalog.DeltaCatalog

# Performance / Local Machine
spark.sql.shuffle.partitions       4
spark.sql.session.timeZone         UTC

# HDFS
spark.hadoop.fs.defaultFS          hdfs://namenode:8020

# Hive Metastore

spark.sql.catalogImplementation   hive
spark.sql.hive.metastore.uris     thrift://hive-metastore:9083

spark.sql.hive.metastore.version  3.1.3
spark.sql.hive.metastore.jars     maven

spark.sql.warehouse.dir           hdfs://namenode:8020/lakehouse/warehouse